/mvp2_test_robot/mvp_c2_traffic_manager:
  ros__parameters:

    serial:
      mac:
        local_address: 0
        local_slot_time: 30
        max_frame_bytes: 100
        #Set the remote address's and coresponding slot times
        remotes:
          "1": 30


      messages:

        load: [
          #select the subbuffer_id(s) to load to the dynamic buffer
          "Joy",
          "PWM",
          "Odometry",
          "GeoPose",
          "PowerMonitor",
          "CPUMonitor",
          "SetPowerPort",
          "ReportPowerPort",
          "SetController",
          "ReportController",
          "SetHelm",
          "ReportHelm",
          "SetWpt",
          "ReportWpt",
          "ResetMission",
          "RosLaunch",
          "ReportRosLaunch"]

        #buffer configuration (https://goby.software/3.0/md_doc101_acomms-queue.html)
