tdma:
  default: &tdma
    source: 1
    destination: 2
    slot_time: 5
    max_frame_bytes: 100
    max_num_frames: 1
    rate: 0

  acomms:
    slots: 
      - <<: *tdma
        source: 1
        destination: 2

      - <<: *tdma
        source: 2
        destination: 1

      - <<: *tdma
        source: 1
        destination: 3

      - <<: *tdma
        source: 3
        destination: 1

      - <<: *tdma
        source: 2
        destination: 3

      - <<: *tdma
        source: 3
        destination: 2