test/mvp_c2_traffic_control:
  ros__parameters:
    # --- Buffer Global Settings ---
    dynamic_buffer:
      max_total_size: 150
      dccl_intake_message_list: ["Odometry", "GeoPose", "PowerMonitor"]

    # --- Message Specific Rules ---
    message_rules:
      Odometry:
        priority: 10
        ttl: 5
        group: "Odometry"
      GeoPose:
        priority: 12
        ttl: 300
        group: "GeoPose"
      PowerMonitor:
        priority: 5
        ttl: 10
        group: "PowerMonitor"